# Author: zhangqi

name: build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: "--cap-lints warn"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            platform: linux-aarch64
            target: aarch64-unknown-linux-musl
          - os: windows-latest
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust 1.88
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.88"
          target: ${{ matrix.target }}

      - name: Install musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
        shell: bash

      - name: Install cross
        if: matrix.target == 'aarch64-unknown-linux-musl'
        uses: taiki-e/install-action@cross

      - name: Build with Cargo
        if: matrix.target != 'aarch64-unknown-linux-musl'
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Build with cross
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cross build --locked --release --target ${{ matrix.target }}

      - name: Prepare Linux package
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/cometix dist/
          cp README.md README_CN.md LICENSE dist/
          tar -czf cometix-${{ matrix.platform }}-${{ github.ref_type == 'tag' && github.ref_name || github.sha }}.tar.gz -C dist .
        shell: bash

      - name: Prepare Windows package
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/${{ matrix.target }}/release/cometix.exe dist/
          Copy-Item README.md, README_CN.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath "cometix-${{ matrix.platform }}-${{ github.ref_type == 'tag' && github.ref_name || github.sha }}.zip"
        shell: pwsh

      - name: Upload Linux artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: cometix-${{ matrix.platform }}
          path: cometix-${{ matrix.platform }}-*.tar.gz
          if-no-files-found: error

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: cometix-${{ matrix.platform }}
          path: cometix-${{ matrix.platform }}-*.zip
          if-no-files-found: error

  release:
    name: upload release assets
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
